# ProShop — single Compose file for every deployment target.
#
# One service definition per role; what differs per host is a profile plus a
# couple of environment variables, instead of three near-duplicate files.
#
#   dev  all-in-one (VPS / local):  docker compose --profile dev up -d --build
#   app  EC2 app host:              docker compose --profile app up -d
#   db   EC2 mongo host:            docker compose --profile db  up -d
#
# Or pin the profile per host in .env:   COMPOSE_PROFILES=app
#
# Target differences expressed as env vars:
#   MONGO_HOST        backend's Mongo host      dev: mongo       app host: 10.0.2.103
#   MONGO_BIND        mongo's published bind    dev: 127.0.0.1   db host:  10.0.2.103
#   BACKEND_IMAGE /   image refs pulled on the   set on the app host (ECR refs);
#   FRONTEND_IMAGE    app host                   dev falls back to :local tags
#
# Public surface: only Nginx (port 80) is published on dev/app hosts. MongoDB is
# published on loopback in dev and on the private IP on the db host; never on
# 0.0.0.0.

services:
  mongo:
    image: mongo:7
    profiles: ["dev", "db"]
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-proshop}
    volumes:
      - mongo-data:/data/db
    ports:
      # dev: loopback only (Compass can attach directly, never public).
      # db host: MONGO_BIND=10.0.2.103 so only the app host can reach it.
      - "${MONGO_BIND:-127.0.0.1}:27017:27017"
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' | grep 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    image: ${BACKEND_IMAGE:-proshop-backend:local}
    profiles: ["dev", "app"]
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      UPLOAD_DIR: /app/uploads
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST:-mongo}:27017/${MONGO_DB}?authSource=admin
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      # Ordered startup in dev; on the app host there is no local Mongo, so the
      # dependency is optional rather than an error.
      mongo:
        condition: service_healthy
        required: false
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    image: ${FRONTEND_IMAGE:-proshop-frontend:local}
    profiles: ["dev", "app"]
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
        VITE_STRIPE_PUBLIC_KEY: ${VITE_STRIPE_PUBLIC_KEY:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    profiles: ["dev", "app"]
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
  uploads-data:
