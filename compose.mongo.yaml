# Production MongoDB host (private subnet).
#
# Usage on the mongo server:
#   cp .env.example .env && edit MONGO_* values
#   docker compose -f compose.mongo.yaml up -d
#
# Port 27017 is reachable only from the app host's security group; it is never
# exposed to the internet (see infra/aws-outputs.env for the private IP).

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-proshop}
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' | grep 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  mongo-data:
