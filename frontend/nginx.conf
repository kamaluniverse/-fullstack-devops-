# Nginx config for the compiled React app (served inside the frontend container).
# The public entry point is the separate reverse proxy in ../nginx/default.conf,
# which forwards "/" to this container. Keep this file focused on static assets
# and the SPA fallback so the two configurations never overlap.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Container-local health endpoint (not exposed publicly by the proxy).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # React client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
